<!DOCTYPE html>
<html lang="fr">
    <head>
         <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Smart Stream | Live TV</title>
        <link rel="stylesheet" href="./css/output.css">
    </head>
    <body>
        <header class="flex flex-col gap-4 w-full bg-[#0F172A] px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6">
           <div class="flex flex-rows items-center gap-3">
                <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#9333EA]">
                    <img src="./img/logo.png"alt="Smart Stream TV"class="w-10 h-10 object-contain">
                </div>
                    <h1 class="font-bold text-white">Smart Stream TV</h1>
           </div>
                <div class="w-full sm:w-72 ">
                    <input type="text" placeholder="Rechercher par nom ou numéro..." class="w-auto min-w-0  rounded-lg border border-[#334155] bg-[#1E293B] px-4 py-2  text-white placeholder-[#94A3B8] outline-none focus:border-[#9333EA] ">
                </div>
            
        </header>
        <main class="flex min-h-[calc(100vh-56px)] flex-col bg-[#0F172A] md:flex-row">
            <aside class="w-full border-b border-[#1E293B] p-4 md:w-64 md:border-b-0 md:border-r">
                <div class="mb-4 flex items-center justify-between">
                    <h2 class="font-semibold text-white">Chaines</h2>
                    <span class="rounded bg-[#1E293B] px-2 py-1 text-xs text-[#94A3B8]">3</span>
                </div>
                <div class="flex flex-col gap-3">
                    <div class="flex  items-center gap-3 rounded-lg bg-[#9333EA] p-3">
                        <span class="text-xs text-white">1057</span>
                        <div class="flex h-8 w-8 items-center justify-center rounded bg-white font-bold text-[#0F172A]">ID</div>
                        <div>
                        <h3 class="text-xs font-semibold text-white">FR - DISCOVERY ID FHD</h3>
                        <span class=" text-[9px] text-purple-200">DOCUMENTAIRE</span>
                        </div>
                    </div>
                    <div class="flex  items-center gap-3 rounded-lg bg-[#29374D] p-3">
                        <span class="text-xs text-white">1058</span>
                        <div class="flex h-8 w-8 items-center justify-center rounded bg-white font-bold text-[#0F172A]">TLC</div>
                        <div>
                        <h3 class="text-xs font-semibold text-white">FR - TLC FHD</h3>
                        <span class=" text-[9px] text-purple-200">DOCUMENTAIRE</span>
                        </div>
                    </div>
                    <div class="flex  items-center gap-3 rounded-lg bg-[#29374D] p-3">
                        <span class="text-xs text-white">1067</span>
                        <div class="flex h-8 w-8 items-center justify-center rounded bg-white font-bold text-[#0F172A]">RMC</div>
                        <div>
                        <h3 class="text-xs font-semibold text-white">FR - RMC DECOUVERTE FHD</h3>
                        <span class=" text-[9px] text-purple-200">DOCUMENTAIRE</span>
                        </div>
                    </div>
                </div>
            </aside>
            <section class="min-w-0 flex-1 p-4 md:p-6">
                <h2 class="mb-4 text-sm font-semibold text-white">Regarder en direct</h2>
                <div class="flex aspect-video items-center justify-center rounded-xl bg-[#1E293B]">
                    <button class="flex h-14 w-14 items-center justify-center rounded-full bg-[#9333EA] text-2xl text-white">
                        ▶
                    </button>
                </div>
                <div class="mt-4">
                    <h2 class="font-bold text-white">FR - DISCOVERY ID FHD</h2>
                    <div class="mt-2 flex gap-2">
                        <span class="rounded bg-[#1E293B] px-2 py-1 text-xs text-[#94A3B8]">N° 1057</span>
                        <span class="rounded bg-[#1E293B] px-2 py-1 text-xs text-[#94A3B8]">DOCUMENTAIRE</span>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
